#
# Workflow: Build&Test PR for Hazelcast organization members
#
# Builds the code and run tests on a 2-dimension matrix of OS and frameworks, but
# only if the user is a member of the Hazelcast organization, as running the tests
# may end up running unsafe user code or expose secrets such as the enterprise key.
#
# Relies on build-and-test.yml workflow to do the actual building and testing of
# each OS and framework. Results are uploaded as artifacts and published as checks.
#
# Creates the 'Build&Test Result' check which is the check that GitHub requires
# (the PR cannot be merged until that check has completed successfully).
#

name: Build&Test PR
on: 

  # automatic on every pull request
  pull_request_target:

  # manual (for community PRs that we want to force-run here)  
  workflow_dispatch:
    inputs:

      # the PR number eg 712
      pr_number:
        description: Enter guest PR number to run test & coverage on it.
        required: true

      # the PR HEAD commit SHA which MUST have been verified
      pr_commit:
        description: Enter guest PR verified HEAD commit SHA.
        required: true

jobs:

  # test hazelcast membership
  test-membership:
    name: Test Hazelcast Membership
    runs-on: ubuntu-latest
    outputs:
      is-hazelcast: ${{ steps.test-membership.outputs.check-result }}

    steps:
      - name: Test
        id: test-membership
        uses: hazelcast/hazelcast-tpm/membership@main
        with:
          member-name: ${{ github.triggering_actor }}
          token: ${{ secrets.GH_TOKEN }}

  # ensure we are an Hazelcast organization member OR manually running
  ensure-membership:
    name: Ensure Membership
    runs-on: ubuntu-latest
    needs: test-membership
    if: needs.test-membership.outputs.is-hazelcast == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Report
        shell: bash
        run: echo "User ${{ github.triggering_actor }} is trusted for test execution"

  # get frameworks
  get-fwks:
    name: Get Frameworks
    uses: ./.github/workflows/get-frameworks.yml
    needs: ensure-membership
    secrets: inherit

  # resolve the exact commits to build, using the GitHub API only (no PR code is
  # checked out here). Outputs:
  #   ref        - the SHA of the PR test-merge commit to check out
  #   merged-ref - the PR head SHA that was approved (event head, or verified input)
  # The merge commit is verified to have the base tip as first parent and the
  # approved head as second parent, so a push after approval fails the run.
  get-refs:
    name: Get Refs
    runs-on: ubuntu-latest
    needs: ensure-membership
    permissions:
      contents: read
      pull-requests: read
    outputs:
      ref: ${{ steps.get-refs.outputs.ref }}
      merged-ref: ${{ steps.get-refs.outputs.merged-ref }}

    steps:
      - name: Get Refs
        id: get-refs
        uses: actions/github-script@v7
        env:
          # passed through env, never interpolated into the script
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event.pull_request.number }}
          PR_COMMIT: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_commit || github.event.pull_request.head.sha }}
        with:
          script: |
            const prNumberText = (process.env.PR_NUMBER || '').trim();
            const expectedHead = (process.env.PR_COMMIT || '').trim().toLowerCase();

            if (!/^[0-9]+$/.test(prNumberText)) {
              core.setFailed(`Invalid PR number '${prNumberText}'.`);
              return;
            }
            if (!/^[0-9a-f]{40}$/.test(expectedHead)) {
              core.setFailed(`Invalid PR commit '${expectedHead}', expected a full 40-character SHA.`);
              return;
            }
            const prNumber = Number(prNumberText);
            core.info(`EVENT: ${process.env.EVENT_NAME}`);
            core.info(`PR_NUMBER: ${prNumber}`);
            core.info(`PR_COMMIT: ${expectedHead}`);

            const { owner, repo } = context.repo;
            const attempts = 10;
            const delayMs = 6000;
            let reason = '';

            for (let i = 1; i <= attempts; i++) {
              if (i > 1) await new Promise(r => setTimeout(r, delayMs));

              const { data: pr } = await github.rest.pulls.get({ owner, repo, pull_number: prNumber });

              if (pr.state !== 'open') {
                core.setFailed(`PR #${prNumber} is ${pr.state}.`);
                return;
              }
              if (pr.head.sha.toLowerCase() !== expectedHead) {
                core.setFailed(`PR #${prNumber} head is now ${pr.head.sha}, not the approved ${expectedHead}. ` +
                               `A newer push needs its own approved run.`);
                return;
              }
              if (pr.mergeable === false) {
                core.setFailed(`PR #${prNumber} cannot be merged (conflicts), there is no merge commit to build.`);
                return;
              }

              // mergeable is null while GitHub is still computing the test-merge commit
              if (pr.mergeable === null || !pr.merge_commit_sha) {
                reason = 'merge commit not computed yet';
                core.info(`Attempt ${i}/${attempts}: ${reason}, retrying.`);
                continue;
              }

              const { data: commit } = await github.rest.git.getCommit({ owner, repo, commit_sha: pr.merge_commit_sha });
              const parents = commit.parents.map(p => p.sha.toLowerCase());

              if (parents.length === 2 && parents[0] === pr.base.sha.toLowerCase() && parents[1] === expectedHead) {
                core.info(`Merge commit ${commit.sha} verified: base ${parents[0]} + head ${parents[1]}.`);
                core.setOutput('ref', commit.sha.toLowerCase());
                core.setOutput('merged-ref', expectedHead);
                return;
              }

              // the merge commit can lag behind a base or head update, try again
              reason = `merge commit ${commit.sha} has parents [${parents.join(', ')}], ` +
                       `expected [${pr.base.sha}, ${expectedHead}]`;
              core.info(`Attempt ${i}/${attempts}: ${reason}, retrying.`);
            }

            core.setFailed(`Could not verify the merge commit for PR #${prNumber}: ${reason}.`);

  # build & test
  build-test:
    name: Build&Test / ${{ matrix.os }}
    needs: [ get-fwks, get-refs ]

    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]

    uses: ./.github/workflows/build-and-test.yml
    secrets: inherit
    with:
      os: ${{ matrix.os }}
      fwks: ${{ needs.get-fwks.outputs[format('fwks-{0}', matrix.os)] }}
      ref: ${{ needs.get-refs.outputs.ref }}
      merged-ref: ${{ needs.get-refs.outputs.merged-ref }}

  # create the result check
  report:
    name: Build&Test Result
    runs-on: ubuntu-latest
    if: always()
    needs: build-test

    steps:
    - name: Report
      shell: bash
      run: |
        if [ "${{ needs.build-test.result }}" == "success" ]; then
          echo "All Build&Test checks completed successfully."
        else
          echo "At least one Build&Test check has failed."
          echo "::error::At least one Build&Test check has failed."
          exit 1
        fi
      
  # create checks
  create-checks:
    name: Create Checks
    if: always()
    needs: build-test

    uses: ./.github/workflows/create-checks.yml
    secrets: inherit
    with:
      conclusion: ${{ needs.build-test.result }}
      #run_id: ${{ github.run_id }} # run id
      head_sha: ${{ github.event.pull_request.head.sha }} # sha that triggered the workflow
      coverage: true
